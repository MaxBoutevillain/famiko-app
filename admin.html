<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Famiko Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Caprasimo&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --primary: #881337;
  --primary-light: #fce7ec;
  --bg: #FAFAF7;
  --white: #ffffff;
  --text: #1d2d44;
  --muted: #6b7280;
  --border: #e5e7eb;
  --danger: #dc2626;
  --success: #16a34a;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

/* HEADER */
header { background: var(--primary); padding: 0 24px; height: 56px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
header h1 { font-family: 'Caprasimo', cursive; color: white; font-size: 20px; }
header span { color: rgba(255,255,255,0.7); font-size: 13px; }
#cnt { color: white; font-weight: 600; }

/* LAYOUT */
.layout { display: flex; flex: 1; overflow: hidden; }

/* SIDEBAR */
.sidebar { width: 280px; flex-shrink: 0; background: var(--white); border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; }
.sidebar-top { padding: 12px; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 8px; }
.sidebar-top input { width: 100%; padding: 8px 12px; border: 1.5px solid var(--border); border-radius: 8px; font: 13px 'Inter', sans-serif; outline: none; color: var(--text); }
.sidebar-top input:focus { border-color: var(--primary); }
.btn-new { width: 100%; padding: 10px; border-radius: 8px; background: var(--primary); color: white; border: none; font: 600 13px 'Inter', sans-serif; cursor: pointer; }
.btn-new:hover { background: #6f0f2e; }
.list { overflow-y: auto; flex: 1; }
.item { padding: 11px 14px; border-bottom: 1px solid var(--border); cursor: pointer; display: flex; align-items: center; gap: 10px; transition: background .1s; }
.item:hover { background: #fafafa; }
.item.active { background: var(--primary-light); border-left: 3px solid var(--primary); }
.item .emoji { font-size: 20px; width: 26px; text-align: center; flex-shrink: 0; }
.item .info strong { display: block; font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 190px; }
.item .info span { font-size: 11px; color: var(--muted); }
.badge { display: inline-block; padding: 1px 6px; border-radius: 10px; font-size: 10px; font-weight: 500; }
.badge-p { background: #fef3c7; color: #92400e; }
.badge-f { background: #dcfce7; color: #166534; }
.empty-list { padding: 32px; text-align: center; color: var(--muted); font-size: 13px; }

/* DETAIL */
.detail { flex: 1; overflow-y: auto; padding: 28px 32px; }
.placeholder { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--muted); gap: 12px; }
.placeholder svg { opacity: .25; }
.placeholder p { font-size: 15px; }

/* FORM */
.form-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
.form-head h2 { font-family: 'Caprasimo', cursive; font-size: 20px; color: var(--primary); }
.form-actions { display: flex; gap: 8px; }
.btn { padding: 9px 16px; border-radius: 8px; font: 500 13px 'Inter', sans-serif; cursor: pointer; border: none; display: inline-flex; align-items: center; gap: 5px; transition: all .15s; white-space: nowrap; }
.btn-save { background: var(--primary); color: white; }
.btn-save:hover { background: #6f0f2e; }
.btn-del { background: transparent; color: var(--danger); border: 1.5px solid #fecaca; }
.btn-del:hover { background: #fef2f2; }

.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; max-width: 700px; }
.fg { display: flex; flex-direction: column; gap: 5px; }
.fg.full { grid-column: 1/-1; }
.fg label { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
.fg input, .fg textarea, .fg select {
  padding: 9px 11px; border: 1.5px solid var(--border); border-radius: 8px;
  font: 14px 'Inter', sans-serif; color: var(--text); outline: none; background: var(--white); width: 100%;
}
.fg input:focus, .fg textarea:focus, .fg select:focus { border-color: var(--primary); }
.fg textarea { resize: vertical; min-height: 80px; line-height: 1.5; }
.pills { display: flex; flex-wrap: wrap; gap: 7px; }
.pill { padding: 5px 11px; border: 1.5px solid var(--border); border-radius: 20px; font-size: 12px; cursor: pointer; user-select: none; transition: all .12s; }
.pill.on { background: var(--primary-light); border-color: var(--primary); color: var(--primary); font-weight: 600; }
.toggle-row { display: flex; align-items: center; gap: 10px; font-size: 14px; }
.toggle { position: relative; width: 38px; height: 21px; flex-shrink: 0; }
.toggle input { display: none; }
.track { position: absolute; inset: 0; background: var(--border); border-radius: 11px; cursor: pointer; transition: background .2s; }
.track:before { content: ''; position: absolute; width: 15px; height: 15px; left: 3px; top: 3px; background: white; border-radius: 50%; transition: transform .2s; }
.toggle input:checked + .track { background: var(--primary); }
.toggle input:checked + .track:before { transform: translateX(17px); }

/* CONFIRM */
.overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 100; align-items: center; justify-content: center; }
.overlay.open { display: flex; }
.confirm { background: var(--white); border-radius: 14px; padding: 28px 24px; max-width: 340px; width: 90%; text-align: center; box-shadow: 0 8px 32px rgba(0,0,0,.15); }
.confirm .icon { font-size: 32px; margin-bottom: 10px; }
.confirm h3 { font-size: 16px; font-weight: 600; margin-bottom: 6px; }
.confirm p { color: var(--muted); font-size: 13px; margin-bottom: 20px; line-height: 1.5; }
.confirm-btns { display: flex; gap: 8px; justify-content: center; }

/* TOAST */
.toast { position: fixed; bottom: 20px; right: 20px; padding: 11px 16px; border-radius: 9px; font: 500 13px 'Inter', sans-serif; color: white; background: var(--text); box-shadow: 0 4px 12px rgba(0,0,0,.15); transform: translateY(50px); opacity: 0; transition: all .25s; z-index: 200; }
.toast.show { transform: translateY(0); opacity: 1; }
.toast.ok { background: var(--success); }
.toast.err { background: var(--danger); }

/* SPINNER */
.spin { display: inline-block; width: 16px; height: 16px; border: 2px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin .6s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* PHOTO UPLOAD */
.photo-zone { border: 2px dashed var(--border); border-radius: 10px; padding: 16px; display: flex; align-items: center; gap: 14px; cursor: pointer; transition: border-color .15s; }
.photo-zone:hover { border-color: var(--primary); }
.photo-preview { width: 80px; height: 80px; border-radius: 8px; object-fit: cover; flex-shrink: 0; }
.photo-placeholder { width: 80px; height: 80px; border-radius: 8px; background: var(--bg); display: flex; align-items: center; justify-content: center; font-size: 28px; flex-shrink: 0; }
.photo-info { flex: 1; }
.photo-info p { font-size: 13px; font-weight: 500; color: var(--text); margin-bottom: 3px; }
.photo-info small { font-size: 12px; color: var(--muted); }
.btn-upload { padding: 7px 14px; border-radius: 7px; background: var(--primary-light); color: var(--primary); border: none; font: 600 12px 'Inter', sans-serif; cursor: pointer; }
.uploading { opacity: .6; pointer-events: none; }

/* SECTIONS */
.section { background: var(--white); border: 1px solid var(--border); border-radius: 12px; padding: 20px 22px; margin-bottom: 18px; max-width: 760px; }
.section-title { font-family: 'Caprasimo', cursive; font-size: 15px; color: var(--primary); display: flex; align-items: center; gap: 9px; margin-bottom: 3px; }
.section-num { display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; border-radius: 50%; background: var(--primary-light); color: var(--primary); font-size: 11px; font-weight: 700; font-family: 'Inter', sans-serif; flex-shrink: 0; }
.section-desc { font-size: 12px; color: var(--muted); margin: 2px 0 16px 31px; }

/* SEGMENTED CONTROLS */
.seg { display: flex; flex-wrap: wrap; gap: 7px; }
.seg-btn { padding: 7px 13px; border: 1.5px solid var(--border); border-radius: 8px; font-size: 12.5px; cursor: pointer; background: var(--white); color: var(--text); transition: all .12s; user-select: none; }
.seg-btn:hover { border-color: var(--primary); }
.seg-btn.on { background: var(--primary); border-color: var(--primary); color: white; font-weight: 600; }

/* DEV SCORES */
.score-legend { font-size: 11.5px; color: var(--muted); background: var(--bg); border-radius: 8px; padding: 10px 12px; margin-bottom: 14px; line-height: 1.7; }
.score-grid { display: flex; flex-direction: column; }
.score-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--border); }
.score-row:last-child { border-bottom: none; }
.score-label { font-size: 13px; font-weight: 500; flex: 1; }
.score-btns { display: flex; gap: 6px; flex-shrink: 0; }
.score-btn { width: 30px; height: 30px; border-radius: 8px; border: 1.5px solid var(--border); background: white; font: 600 13px 'Inter', sans-serif; cursor: pointer; color: var(--muted); transition: all .12s; }
.score-btn:hover { border-color: var(--primary); }
.score-btn.on { background: var(--primary); border-color: var(--primary); color: white; }
.top-dims { font-size: 12.5px; color: var(--primary); background: var(--primary-light); border-radius: 8px; padding: 9px 12px; margin-top: 14px; font-weight: 500; }

/* TAGS */
.tags-box { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px; border: 1.5px solid var(--border); border-radius: 8px; background: white; align-items: center; }
.tags-box:focus-within { border-color: var(--primary); }
.tag-chip { display: inline-flex; align-items: center; gap: 5px; background: var(--primary-light); color: var(--primary); border-radius: 14px; padding: 4px 8px 4px 11px; font-size: 12px; font-weight: 500; white-space: nowrap; }
.tag-chip button { border: none; background: none; color: var(--primary); cursor: pointer; font-size: 15px; line-height: 1; padding: 0; }
.tags-input { border: none; outline: none; flex: 1; min-width: 140px; font: 13px 'Inter', sans-serif; padding: 4px; background: transparent; }

/* ADAPTATIONS */
.adapt-empty { font-size: 12.5px; color: var(--muted); font-style: italic; }
</style>
</head>
<body>

<header>
  <h1>famiko admin</h1>
  <span><span id="cnt">—</span> activités</span>
</header>

<div class="layout">
  <div class="sidebar">
    <div class="sidebar-top">
      <input id="q" placeholder="🔍 Rechercher…">
      <button class="btn-new" id="btnNew">+ Nouvelle activité</button>
    </div>
    <div class="list" id="list">
      <div class="empty-list"><div class="spin"></div></div>
    </div>
  </div>
  <div class="detail" id="detail">
    <div class="placeholder">
      <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M3 9h18M9 21V9"/></svg>
      <p>Clique sur une activité pour la modifier</p>
    </div>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="confirm">
    <div class="icon">🗑️</div>
    <h3>Supprimer cette activité ?</h3>
    <p id="confirmText">Cette action est irréversible.</p>
    <div class="confirm-btns">
      <button class="btn" style="border:1.5px solid var(--border);color:var(--muted)" id="btnCancelDel">Annuler</button>
      <button class="btn btn-del" id="btnConfirmDel">Supprimer</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
var URL = 'https://ylezmayjfkrjysvfkayc.supabase.co';
var KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlsZXptYXlqZmtyanlzdmZrYXljIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc3MzM4NTYxMCwiZXhwIjoyMDg4OTYxNjEwfQ.JSlGnrDnO0B7FVhN78eLSHuYq6yGZAQ4nDhcWbhoeb8';

var PASS = 'famiko2026';
if (sessionStorage.getItem('auth') !== PASS) {
  var input = prompt('Mot de passe admin :');
  if (input !== PASS) {
    document.body.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100vh;font-family:sans-serif;color:#881337;font-size:18px;">Accès refusé</div>';
    throw new Error('Accès refusé');
  }
  sessionStorage.setItem('auth', PASS);
}

var all = [], current = null, delId = null;
// Références partagées entre renderForm() et saveForm() : mêmes objets/tableaux
// mutés en place, donc toujours à jour au moment de la sauvegarde.
var formAdaptData = {}, formTags = [];

// API
function api(path, method, body) {
  return fetch(URL + '/rest/v1/' + path, {
    method: method || 'GET',
    headers: { 'apikey': KEY, 'Authorization': 'Bearer ' + KEY, 'Content-Type': 'application/json', 'Prefer': 'return=representation' },
    body: body ? JSON.stringify(body) : undefined
  }).then(function(r) {
    if (!r.ok) return r.json().then(function(e) { throw new Error(e.message || 'Erreur ' + r.status); });
    return r.text().then(function(t) { return t ? JSON.parse(t) : null; });
  });
}

// Toast
var toastT;
function toast(msg, type) {
  clearTimeout(toastT);
  var el = document.getElementById('toast');
  el.textContent = msg; el.className = 'toast show ' + (type||'');
  toastT = setTimeout(function(){ el.className = 'toast'; }, 3000);
}

// Load
function load() {
  document.getElementById('list').innerHTML = '<div class="empty-list"><div class="spin"></div></div>';
  api('activities?select=*&order=title.asc').then(function(data) {
    all = data || [];
    document.getElementById('cnt').textContent = all.length;
    if (current) {
      var updated = all.find(function(a) { return a.id === current.id; });
      if (updated) current = updated;
    }
    renderList(all);
  }).catch(function(e) {
    document.getElementById('list').innerHTML = '<div class="empty-list">⚠️ ' + e.message + '</div>';
  });
}

// Render list
function renderList(items) {
  var el = document.getElementById('list');
  if (!items.length) { el.innerHTML = '<div class="empty-list">Aucune activité</div>'; return; }
  el.innerHTML = '';
  items.forEach(function(a) {
    var d = document.createElement('div');
    d.className = 'item' + (current && current.id === a.id ? ' active' : '');
    var moodsDisplay = (a.moods || []).map(function(m) {
       var found = MOODS.find(function(M) { return M.id === m; });
       return found ? found.emoji + ' ' + found.short : m;
     }).join(' · ') || '—';
     d.innerHTML = '<div class="emoji">'+(a.emoji||'📌')+'</div><div class="info"><strong>'+(a.title||'—')+'</strong><span>'+moodsDisplay+' &nbsp;<span class="badge '+(a.is_premium?'badge-p':'badge-f')+'">'+(a.is_premium?'Premium':'Gratuit')+'</span></span></div>';
    d.addEventListener('click', function() { current = a; renderList(filterItems()); renderForm(a); });
    el.appendChild(d);
  });
}

function filterItems() {
  var q = document.getElementById('q').value.toLowerCase();
  return all.filter(function(a) {
     if (!q) return true;
     var matchTitle = (a.title||'').toLowerCase().includes(q);
     var matchMood = (a.moods || []).some(function(m) {
       var found = MOODS.find(function(M) { return M.id === m; });
       return found && (found.label.toLowerCase().includes(q) || found.short.toLowerCase().includes(q));
     });
     return matchTitle || matchMood;
   });
}

document.getElementById('q').addEventListener('input', function() { renderList(filterItems()); });
document.getElementById('btnNew').addEventListener('click', function() { current = null; renderList(filterItems()); renderForm(null); });

// Render form
var MOODS = [
     { id: 'calm',     label: 'Se poser ensemble',    emoji: '🌙', short: 'Doux' },
     { id: 'move',     label: 'Se défouler',          emoji: '⚡', short: 'Défouler' },
     { id: 'create',   label: 'Créer avec les mains', emoji: '🎨', short: 'Créer' },
     { id: 'explore',  label: 'Explorer le monde',    emoji: '🔍', short: 'Explorer' },
     { id: 'outdoor',  label: 'Sortir prendre l\'air', emoji: '🌿', short: 'Dehors' },
     { id: 'surprise', label: 'Me surprendre',        emoji: '✨', short: 'Surprise' },
   ];
var AGES = [['0-6m','0–6 mois'],['6-12m','6–12 mois'],['1-3','1–3 ans'],['3-6','3–6 ans'],['6-9','6–9 ans'],['9+','9 ans+']];
var AGE_LABELS = {}; AGES.forEach(function(ag){ AGE_LABELS[ag[0]] = ag[1]; });

// Nouveaux attributs de contexte (section "Quand la proposer")
var INTENSITY    = [['calm','😌 Calme'],['moderate','🙂 Modérée'],['high','🔥 Élevée']];
var PREP         = [['none','Aucune'],['light','Légère'],['required','Nécessaire']];
var INVOLVEMENT  = [['low','Faible'],['occasional','Ponctuelle'],['active','Active']];
var DIFFICULTY   = [['1','1'],['2','2'],['3','3']];
var FREEDOM      = [['guided','Guidée'],['semi_free','Semi-libre'],['free','Libre']];

// Référentiel Développement & éveil (section "Ce qu'elle fait explorer")
var DEV_DIMS = [
  { id: 'grossMotor',            label: 'Motricité globale' },
  { id: 'balanceCoordination',   label: 'Équilibre & coordination' },
  { id: 'fineMotor',             label: 'Motricité fine & manipulation' },
  { id: 'spatialBodyAwareness',  label: 'Repérage spatial & corps' },
  { id: 'attentionOrganization', label: 'Attention & organisation' },
  { id: 'languageExpression',    label: 'Langage & expression' },
  { id: 'imaginationCreativity', label: 'Imagination & créativité' },
  { id: 'autonomyConfidence',    label: 'Autonomie & confiance' }
];

function parseField(val) {
  if (!val) return [];
  if (Array.isArray(val)) return val.map(String).filter(Boolean);
  try {
    var parsed = JSON.parse(val);
    while (typeof parsed === 'string') { parsed = JSON.parse(parsed); }
    if (Array.isArray(parsed)) return parsed.map(String).filter(Boolean);
    return [String(parsed)];
  } catch(e) {
    return val.split('\n').filter(Boolean);
  }
}

// Comme parseField, mais pour un objet JSON. Gère à la fois une colonne jsonb
// (déjà un objet côté PostgREST, ex. dev_scores) et une colonne text contenant
// du JSON stringifié (ex. age_adaptations). Ne remplit jamais de valeur par
// défaut : une clé absente reste absente.
function parseObj(val) {
  if (!val) return {};
  if (typeof val === 'object' && !Array.isArray(val)) return val;
  try {
    var parsed = JSON.parse(val);
    while (typeof parsed === 'string') { parsed = JSON.parse(parsed); }
    return (parsed && typeof parsed === 'object') ? parsed : {};
  } catch(err) { return {}; }
}

function e(s) { return (s||'').toString().replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }

// Segmented control générique : un groupe de boutons exclusifs, re-cliquer sur
// le bouton actif le désélectionne (aucune valeur inventée pour les anciennes activités).
function renderSeg(name, options, selected) {
  return '<div class="seg" data-name="'+name+'">' + options.map(function(o) {
    return '<span class="seg-btn'+(selected===o[0]?' on':'')+'" data-v="'+o[0]+'">'+o[1]+'</span>';
  }).join('') + '</div>';
}
function segVal(name) {
  var b = document.querySelector('.seg[data-name="'+name+'"] .seg-btn.on');
  return b ? b.dataset.v : null;
}

function renderScoreRow(dim, val) {
  return '<div class="score-row"><span class="score-label">'+dim.label+'</span>' +
    '<div class="score-btns" data-dim="'+dim.id+'">' +
      [0,1,2,3].map(function(n) { return '<button type="button" class="score-btn'+(val===n?' on':'')+'" data-v="'+n+'">'+n+'</button>'; }).join('') +
    '</div></div>';
}
function getScores() {
  var out = {};
  document.querySelectorAll('.score-btns').forEach(function(box) {
    var on = box.querySelector('.score-btn.on');
    if (on) out[box.dataset.dim] = parseInt(on.dataset.v, 10);
  });
  return out;
}
// Les 3 dimensions principales sont déduites des scores les plus hauts, jamais stockées.
function topDimsText(scores) {
  var entries = DEV_DIMS
    .map(function(d, idx) { return { label: d.label, val: scores[d.id] != null ? scores[d.id] : -1, idx: idx }; })
    .filter(function(x) { return x.val > 0; })
    .sort(function(x, y) { return y.val - x.val || x.idx - y.idx; })
    .slice(0, 3);
  if (!entries.length) return 'Aucune dimension notée pour le moment.';
  return '🎯 Dimensions principales : ' + entries.map(function(x) { return x.label + ' (' + x.val + ')'; }).join(' · ');
}

function renderAdaptBlock(selectedAges, adaptData) {
  if (!selectedAges.length) return '<p class="adapt-empty">Sélectionne au moins une tranche d\'âge ci-dessus pour saisir une adaptation.</p>';
  return selectedAges.map(function(ag) {
    return '<div class="fg full" style="margin-bottom:10px"><label>Adaptation ' + AGE_LABELS[ag] + '</label>' +
      '<textarea class="adapt-ta" data-age="'+ag+'" rows="2" placeholder="Comment adapter pour '+AGE_LABELS[ag]+' ?">'+e(adaptData[ag]||'')+'</textarea></div>';
  }).join('');
}

function renderForm(a) {
  var isNew = !a;
  var ages = a && a.age_ranges ? a.age_ranges : [];
  var stepsClean = parseField(a ? a.steps : []);
  var matsClean = parseField(a ? a.materials : []);
  var tagsArr = formTags = parseField(a ? a.expert_tags : []);
  var adaptData = formAdaptData = parseObj(a ? a.age_adaptations : null);
  var scores = parseObj(a ? a.dev_scores : null);
  // Durée : les anciennes activités n'ont qu'une valeur unique `duration`.
  // Tant que duration_min/duration_max ne sont pas renseignés, on l'utilise pour les deux.
  var durMin = a && a.duration_min != null ? a.duration_min : (a && a.duration != null ? a.duration : '');
  var durMax = a && a.duration_max != null ? a.duration_max : (a && a.duration != null ? a.duration : '');

  document.getElementById('detail').innerHTML =
    '<div class="form-head">' +
      '<h2>'+(isNew ? 'Nouvelle activité' : '✏️ Modifier')+'</h2>' +
      '<div class="form-actions">' +
        (!isNew ? '<button class="btn btn-del" id="fDel">🗑 Supprimer</button>' : '') +
        '<button class="btn btn-save" id="fSave">💾 Enregistrer</button>' +
      '</div>' +
    '</div>' +

    // SECTION 1 — L'activité
    '<div class="section">' +
      '<div class="section-title"><span class="section-num">1</span>L\'activité</div>' +
      '<div class="section-desc">Ce que le parent et l\'enfant voient</div>' +
      '<div class="grid">' +
        '<div class="fg"><label>Emoji</label><input id="fEmoji" value="'+e(a?a.emoji:'')+'" placeholder="🎨" maxlength="4"></div>' +
        '<div class="fg"></div>' +
        '<div class="fg full"><label>Photo</label>' +
          '<div class="photo-zone" id="photoZone" onclick="document.getElementById(\'fileInput\').click()">' +
            (a&&a.image_url ? '<img class="photo-preview" id="photoPreview" src="'+e(a.image_url)+'">' : '<div class="photo-placeholder" id="photoPreview">🖼️</div>') +
            '<div class="photo-info"><p id="photoName">'+(a&&a.image_url?'Photo actuelle':'Aucune photo')+' </p><small>JPG ou PNG · 2 Mo max</small></div>' +
            '<button class="btn-upload" type="button">Choisir</button>' +
          '</div>' +
          '<input type="file" id="fileInput" accept="image/*" style="display:none">' +
        '</div>' +
        '<div class="fg full"><label>Titre</label><input id="fTitle" value="'+e(a?a.title:'')+'" placeholder="Nom de l\'activité"></div>' +
        '<div class="fg full"><label>Description</label><textarea id="fDesc" rows="3">'+e(a?a.description:'')+'</textarea></div>' +
        '<div class="fg full"><label>Hook enfant</label><input id="fHook" value="'+e(a?a.hook_child:'')+'" placeholder="Tu veux construire quelque chose ?"></div>' +
      '</div>' +
    '</div>' +

    // SECTION 2 — Quand la proposer
    '<div class="section">' +
      '<div class="section-title"><span class="section-num">2</span>Quand la proposer</div>' +
      '<div class="section-desc">Le contexte dans lequel l\'activité fonctionne</div>' +
      '<div class="grid">' +
        '<div class="fg"><label>Durée min (min)</label><input id="fDurMin" type="number" min="1" value="'+durMin+'" placeholder="10"></div>' +
        '<div class="fg"><label>Durée max / habituelle (min)</label><input id="fDurMax" type="number" min="1" value="'+durMax+'" placeholder="15"></div>' +
        '<div class="fg"><label>Lieu</label><select id="fLoc"><option value="indoor"'+(a&&a.location==='indoor'?' selected':'')+'>🏠 Intérieur</option><option value="outdoor"'+(a&&a.location==='outdoor'?' selected':'')+'>🌿 Extérieur</option><option value="both"'+(a&&a.location==='both'?' selected':'')+'>🌍 Les deux</option></select></div>' +
        '<div class="fg"></div>' +
        '<div class="fg full"><label>Tranches d\'âge</label><div class="pills" id="agePills">'+AGES.map(function(ag){return '<span class="pill'+(ages.indexOf(ag[0])!==-1?' on':'')+'" data-v="'+ag[0]+'">'+ag[1]+'</span>';}).join('')+'</div></div>' +
        '<div class="fg full"><label>Moods (1 ou plusieurs)</label><div class="pills" id="moodPills">'+MOODS.map(function(M){var sel=(a&&a.moods&&a.moods.indexOf(M.id)!==-1);return '<span class="pill'+(sel?' on':'')+'" data-v="'+M.id+'">'+M.emoji+' '+M.label+'</span>';}).join('')+'</div></div>' +
        '<div class="fg full"><label>Intensité physique</label>'+renderSeg('intensity', INTENSITY, a?a.physical_intensity:null)+'</div>' +
        '<div class="fg full"><label>Préparation nécessaire</label>'+renderSeg('prep', PREP, a?a.prep_level:null)+'</div>' +
        '<div class="fg full"><label>Implication du parent</label>'+renderSeg('involvement', INVOLVEMENT, a?a.parent_involvement:null)+'</div>' +
        '<div class="fg"><label>Difficulté</label>'+renderSeg('difficulty', DIFFICULTY, a&&a.difficulty!=null?String(a.difficulty):null)+'</div>' +
        '<div class="fg"><label>Liberté laissée à l\'enfant</label>'+renderSeg('freedom', FREEDOM, a?a.child_freedom:null)+'</div>' +
      '</div>' +
    '</div>' +

    // SECTION 3 — Ce qu'elle fait explorer
    '<div class="section">' +
      '<div class="section-title"><span class="section-num">3</span>Ce qu\'elle fait explorer</div>' +
      '<div class="section-desc">Développement & éveil — jeu d\'abord, développement derrière</div>' +
      '<div class="score-legend">0 = non sollicité &nbsp;·&nbsp; 1 = secondaire &nbsp;·&nbsp; 2 = important &nbsp;·&nbsp; 3 = central</div>' +
      '<div class="score-grid" id="scoreGrid">' + DEV_DIMS.map(function(d){ return renderScoreRow(d, scores[d.id]!=null?scores[d.id]:null); }).join('') + '</div>' +
      '<div class="top-dims" id="topDims">' + topDimsText(scores) + '</div>' +
    '</div>' +

    // SECTION 4 — Comment la réaliser
    '<div class="section">' +
      '<div class="section-title"><span class="section-num">4</span>Comment la réaliser</div>' +
      '<div class="section-desc">Matériel et déroulé</div>' +
      '<div class="grid">' +
        '<div class="fg full"><label>Matériel (un par ligne)</label><textarea id="fMat" rows="4">'+e(matsClean.join('\n'))+'</textarea></div>' +
        '<div class="fg full"><label>Étapes (une par ligne)</label><textarea id="fSteps" rows="5">'+e(stepsClean.join('\n'))+'</textarea></div>' +
      '</div>' +
    '</div>' +

    // SECTION 5 — Regard psychomotricien
    '<div class="section">' +
      '<div class="section-title"><span class="section-num">5</span>Regard psychomotricien</div>' +
      '<div class="section-desc">Expertise interne — pas forcément affichée au parent</div>' +
      '<div class="grid">' +
        '<div class="fg full"><label>Conseil psychomotricien</label><textarea id="fPsycho" rows="3">'+e(a?a.psycho_tip:'')+'</textarea></div>' +
        '<div class="fg full"><label>Variante plus facile</label><textarea id="fEasier" rows="2" placeholder="Comment simplifier cette activité ?">'+e(a?a.easier_variant:'')+'</textarea></div>' +
        '<div class="fg full"><label>Variante plus difficile</label><textarea id="fHarder" rows="2" placeholder="Comment augmenter légèrement le défi ?">'+e(a?a.harder_variant:'')+'</textarea></div>' +
        '<div class="fg full"><label>Adaptations par âge</label><div id="adaptBlock">'+renderAdaptBlock(ages, adaptData)+'</div></div>' +
        '<div class="fg full"><label>Tags experts</label>' +
          '<div class="tags-box" id="tagsBox"><span id="tagsChips"></span><input class="tags-input" id="tagInput" placeholder="Ajouter un tag et appuyer sur Entrée"></div>' +
        '</div>' +
      '</div>' +
    '</div>' +

    // SECTION 6 — Publication
    '<div class="section">' +
      '<div class="section-title"><span class="section-num">6</span>Publication</div>' +
      '<div class="section-desc">Statut de diffusion</div>' +
      '<div class="grid">' +
        '<div class="fg full"><label>Statut</label><div class="toggle-row"><label class="toggle"><input type="checkbox" id="fPrem"'+(a&&a.is_premium?' checked':'')+' ><span class="track"></span></label><span id="premLbl">'+(a&&a.is_premium?'Premium 🔒':'Gratuit')+'</span></div></div>' +
      '</div>' +
    '</div>';

  document.getElementById('fPrem').addEventListener('change', function() {
    document.getElementById('premLbl').textContent = this.checked ? 'Premium 🔒' : 'Gratuit';
  });
  document.getElementById('agePills').addEventListener('click', function(ev) {
    var p = ev.target.closest('.pill');
    if (!p) return;
    p.classList.toggle('on');
    refreshAdaptBlock();
  });
  document.getElementById('moodPills').addEventListener('click', function(ev) {
    var p = ev.target.closest('.pill');
    if (p) p.classList.toggle('on');
  });

  // Segmented controls (intensité, préparation, implication, difficulté, liberté)
  document.querySelectorAll('.seg').forEach(function(seg) {
    seg.addEventListener('click', function(ev) {
      var b = ev.target.closest('.seg-btn');
      if (!b) return;
      var wasOn = b.classList.contains('on');
      seg.querySelectorAll('.seg-btn').forEach(function(x) { x.classList.remove('on'); });
      if (!wasOn) b.classList.add('on');
    });
  });

  // Scores Développement & éveil (0–3, re-cliquer désélectionne)
  document.getElementById('scoreGrid').addEventListener('click', function(ev) {
    var btn = ev.target.closest('.score-btn');
    if (!btn) return;
    var box = btn.parentElement;
    var wasOn = btn.classList.contains('on');
    box.querySelectorAll('.score-btn').forEach(function(x) { x.classList.remove('on'); });
    if (!wasOn) btn.classList.add('on');
    document.getElementById('topDims').textContent = topDimsText(getScores());
  });

  // Adaptations par âge : uniquement pour les tranches sélectionnées, sans perdre les autres
  function refreshAdaptBlock() {
    document.querySelectorAll('.adapt-ta').forEach(function(ta) { adaptData[ta.dataset.age] = ta.value; });
    var selected = [];
    document.querySelectorAll('#agePills .pill.on').forEach(function(p) { selected.push(p.dataset.v); });
    document.getElementById('adaptBlock').innerHTML = renderAdaptBlock(selected, adaptData);
  }
  document.getElementById('adaptBlock').addEventListener('input', function(ev) {
    var t = ev.target.closest('.adapt-ta');
    if (t) adaptData[t.dataset.age] = t.value;
  });

  // Tags experts (chips)
  function renderTagsChips() {
    document.getElementById('tagsChips').innerHTML = tagsArr.map(function(t, i) {
      return '<span class="tag-chip">'+e(t)+'<button type="button" data-i="'+i+'">×</button></span>';
    }).join('');
  }
  renderTagsChips();
  document.getElementById('tagsChips').addEventListener('click', function(ev) {
    var b = ev.target.closest('button');
    if (!b) return;
    tagsArr.splice(parseInt(b.dataset.i, 10), 1);
    renderTagsChips();
  });
  document.getElementById('tagInput').addEventListener('keydown', function(ev) {
    if (ev.key !== 'Enter') return;
    ev.preventDefault();
    var v = this.value.trim();
    if (v && tagsArr.indexOf(v) === -1) { tagsArr.push(v); renderTagsChips(); }
    this.value = '';
  });

  // Upload photo
  var pendingImageUrl = a ? (a.image_url || null) : null;
  document.getElementById('fileInput').addEventListener('change', function() {
    var file = this.files[0];
    if (!file) return;
    if (file.size > 2 * 1024 * 1024) { toast('Image trop lourde (max 2 Mo)', 'err'); return; }
    var zone = document.getElementById('photoZone');
    zone.classList.add('uploading');
    document.getElementById('photoName').textContent = 'Upload en cours…';
    var ext = file.name.split('.').pop();
    var filename = 'activity-' + Date.now() + '.' + ext;
    var formData = new FormData();
    formData.append('', file, filename);
    fetch(URL + '/storage/v1/object/activity-images/' + filename, {
      method: 'POST',
      headers: { 'apikey': KEY, 'Authorization': 'Bearer ' + KEY },
      body: file
    }).then(function(r) {
      if (!r.ok) throw new Error('Upload échoué');
      pendingImageUrl = URL + '/storage/v1/object/public/activity-images/' + filename;
      var preview = document.getElementById('photoPreview');
      if (preview.tagName === 'DIV') {
        var img = document.createElement('img');
        img.className = 'photo-preview';
        img.id = 'photoPreview';
        img.src = pendingImageUrl;
        preview.replaceWith(img);
      } else {
        preview.src = pendingImageUrl;
      }
      document.getElementById('photoName').textContent = file.name;
      zone.classList.remove('uploading');
      toast('Photo uploadée ✓', 'ok');
    }).catch(function(err) {
      zone.classList.remove('uploading');
      document.getElementById('photoName').textContent = 'Erreur upload';
      toast('Erreur : ' + err.message, 'err');
    });
  });

  document.getElementById('fSave').addEventListener('click', function() { saveForm(a ? a.id : null, pendingImageUrl); });
  if (!isNew) {
    document.getElementById('fDel').addEventListener('click', function() {
      delId = a.id;
      document.getElementById('confirmText').textContent = '"'+a.title+'" sera supprimée définitivement.';
      document.getElementById('overlay').classList.add('open');
    });
  }
}

function saveForm(id, imageUrl) {
  var title = document.getElementById('fTitle').value.trim();
  if (!title) { toast('Le titre est obligatoire', 'err'); return; }
  var ages = [];
  document.querySelectorAll('#agePills .pill.on').forEach(function(p){ ages.push(p.dataset.v); });

  // Durée min/max : si une seule des deux est renseignée, on reflète l'autre
  // pour rester cohérent (fallback propre, aucune donnée perdue).
  var durMin = parseInt(document.getElementById('fDurMin').value, 10) || null;
  var durMax = parseInt(document.getElementById('fDurMax').value, 10) || null;
  if (durMin && !durMax) durMax = durMin;
  if (durMax && !durMin) durMin = durMax;

  // Adaptations par âge : formAdaptData contient déjà toutes les tranches
  // (y compris celles actuellement masquées) grâce au listener 'input' de renderForm.
  // On resynchronise les champs visibles par sécurité avant lecture.
  document.querySelectorAll('#adaptBlock .adapt-ta').forEach(function(ta) { formAdaptData[ta.dataset.age] = ta.value.trim(); });

  var payload = {
    emoji: document.getElementById('fEmoji').value.trim(),
    title: title,
    description: document.getElementById('fDesc').value.trim(),
    hook_child: document.getElementById('fHook').value.trim(),
    moods: Array.from(document.querySelectorAll('#moodPills .pill.on')).map(function(p) { return p.dataset.v; }),
    location: document.getElementById('fLoc').value,
    duration: durMax || durMin || null, // colonne legacy conservée pour compatibilité
    duration_min: durMin,
    duration_max: durMax,
    age_ranges: ages,
    materials: document.getElementById('fMat').value.split('\n').map(function(s){return s.trim();}).filter(Boolean),
    steps: JSON.stringify(document.getElementById('fSteps').value.split('\n').map(function(s){return s.trim();}).filter(Boolean)),
    psycho_tip: document.getElementById('fPsycho').value.trim(),
    easier_variant: document.getElementById('fEasier').value.trim(),
    harder_variant: document.getElementById('fHarder').value.trim(),
    is_premium: document.getElementById('fPrem').checked,
    image_url: imageUrl || null,
    age_adaptations: JSON.stringify(formAdaptData),
    physical_intensity: segVal('intensity'),
    prep_level: segVal('prep'),
    parent_involvement: segVal('involvement'),
    difficulty: segVal('difficulty') ? parseInt(segVal('difficulty'), 10) : null,
    child_freedom: segVal('freedom'),
    dev_scores: getScores(), // colonne jsonb : on envoie l'objet tel quel, pas de stringify
    expert_tags: formTags
  };
  var p = id ? api('activities?id=eq.'+id, 'PATCH', payload) : api('activities', 'POST', payload);
  p.then(function(res) {
    toast(id ? 'Activité mise à jour ✓' : 'Activité créée ✓', 'ok');
    if (res && res[0]) current = res[0];
    load();
  }).catch(function(err){ toast('Erreur : '+err.message, 'err'); });
}

// Delete
document.getElementById('btnCancelDel').addEventListener('click', function(){ document.getElementById('overlay').classList.remove('open'); });
document.getElementById('btnConfirmDel').addEventListener('click', function() {
  api('activities?id=eq.'+delId, 'DELETE').then(function() {
    toast('Activité supprimée', 'ok');
    document.getElementById('overlay').classList.remove('open');
    current = null;
    document.getElementById('detail').innerHTML = '<div class="placeholder"><p>Sélectionne une activité</p></div>';
    load();
  }).catch(function(e){ toast('Erreur : '+e.message, 'err'); });
});
document.getElementById('overlay').addEventListener('click', function(e){ if(e.target===this) this.classList.remove('open'); });
document.addEventListener('keydown', function(e){ if(e.key==='Escape') document.getElementById('overlay').classList.remove('open'); });

load();
</script>
</body>
</html>
